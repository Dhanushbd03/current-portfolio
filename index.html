    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefers_dark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          if (stored === "dark" || (!stored && prefers_dark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (_) {}
      })();
    </script>
